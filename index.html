<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Html Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="tableExamples">
      <!-- Basic Table -->
      <table class="basic-table">
        <caption>
          Basic Table
        </caption>

        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Department</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Alice Smith</td>
            <td>Software Engineer</td>
            <td>Engineering</td>
          </tr>
          <tr>
            <td>Bob Jones</td>
            <td>UI Designer</td>
            <td>Design</td>
          </tr>
        </tbody>

        <tfoot>
          <tr>
            <td>Total Employees: 2</td>
          </tr>
        </tfoot>
      </table>
      <!-- Basic Table -->
    </section>
  </body>
</html>
